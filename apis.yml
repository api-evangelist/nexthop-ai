aid: nexthop-ai
name: Nexthop AI
description: Nexthop AI is a networking infrastructure company building next-generation, highly efficient
  AI and cloud networking for hyperscalers and neo-cloud operators. Founded by former Arista Networks
  operations leader Anshul Sadana, it designs scale-out and scale-across Ethernet switches, a networking
  software portfolio, and optics and cables engineered to lower the cost per token of large GPU clusters
  by improving power efficiency, cost, reliability, and speed of deployment. The company raised a $500M
  Series B led by Lightspeed Venture Partners and Andreessen Horowitz at a $4.2B valuation and is tracked
  in the API Evangelist network as a Kleiner Perkins portfolio lead. It publishes no public web/REST API
  surface; this profile captures company identity and domain security posture.
